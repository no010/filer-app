name: check

# Run the Rust core unit tests (src-tauri: config / store / watcher — the
# file-moving logic) on every push and PR, so regressions surface here
# instead of at release time. release.yml only builds on `v*` tags and
# never runs tests; this workflow is the fast feedback route.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Versions are hand-maintained in three manifests — catch drift on every
  # push instead of at release time (a mismatch broke updater signing once).
  version-sync:
    name: Version sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/check-version-sync.mjs

  rust-test:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same system deps as release.yml — `cargo test` compiles the tauri
      # crate, which links webkit2gtk on Linux.
      - name: Install Linux system deps (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            patchelf libssl-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --locked
