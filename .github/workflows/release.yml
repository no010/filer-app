name: release

# Build filer for macOS / Windows / Linux on a `v*` tag push and attach the
# installers to a GitHub Release. filer is a Tauri 2 app at repo root.
#
# To cut a release: `git tag v0.1.0 && git push origin v0.1.0`.
# Manual run: Actions tab → release → Run workflow (builds without releasing).
#
# macOS signing/notarization is OPTIONAL — fill the Apple secrets below and
# the build will sign; otherwise it ships an unsigned .dmg (users right-click
# → Open the first time). Windows ships an unsigned NSIS/MSI by default; to
# sign, add a code-signing cert (out of scope here).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed by tauri-action to create the Release + upload assets

jobs:
  # Fail fast on a tag push if the tag doesn't match the version in
  # tauri.conf.json / Cargo.toml / package.json — a mismatch silently breaks
  # the signed updater manifest (happened once: tag vs version drift).
  version-guard:
    runs-on: ubuntu-22.04
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches manifest versions
        # Only pass the tag when this run was actually triggered by one
        # (workflow_dispatch runs check manifest consistency only).
        run: node scripts/check-version-sync.mjs ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build:
    needs: version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    # Skip the build matrix when triggered by `release: published` —
    # the assets already exist from the tag-push run.
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both Apple arches.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (webkit2gtk-4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            patchelf libssl-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend deps
        # `npm install` (not `npm ci`) — the lockfile is generated on Windows
        # and may miss platform-specific optional deps (e.g. @img/sharp /
        # @emnapi variants) that linux/mac need. `npm install` resolves per-
        # platform; `npm ci` would hard-fail on the missing entries.
        working-directory: ui
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI globally (so the action's `tauri` is on PATH)
        run: npm i -g @tauri-apps/cli@^2

      # macOS build ships UNSIGNED by default (users right-click → Open the
      # first time). To enable signing + notarization, add these as `env` on
      # the tauri-action step below (and set the secrets in repo settings):
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD (the .p12, base64)
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID (for notarization)
      # NOTE: GitHub Actions forbids the `secrets` context in a step `if`, so
      # only add the env block once the secrets actually exist (an empty
      # APPLE_CERTIFICATE makes tauri-action attempt `security import` and fail).

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — produces the signed .sig + latest.json
          # manifest the app checks on startup. Private key is a repo secret;
          # if absent, the build still works but auto-update is disabled.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "filer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. macOS: .dmg (unsigned → right-click → Open first time). Windows: .exe (NSIS) / .msi. Linux: .AppImage / .deb."
          releaseDraft: true
          prerelease: false
          # Generate the updater manifest (latest.json) so the in-app updater
          # can find the newest release.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # ── WinGet ─────────────────────────────────────────────────────────
  # Runs only when a GitHub Release is *published* (not on draft creation).
  # Submits the NSIS installer to the winget-pkgs community repo via PR.
  # Requires a repo secret: WINGET_TOKEN (GitHub PAT with public_repo scope).
  # Skip if the secret is missing (e.g. first-time setup).
  winget:
    name: Submit to WinGet
    runs-on: windows-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wingetcreate
        run: iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $exeUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/filer_$($version)_x64-setup.exe"
          .\wingetcreate.exe update com.filer.app `
            --version $version `
            --urls $exeUrl `
            --token ${{ secrets.WINGET_TOKEN }} `
            --submit
        shell: pwsh
